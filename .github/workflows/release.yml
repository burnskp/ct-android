name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate version tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release-version.py "$RELEASE_TAG" --format github >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install Android SDK packages
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - name: Test and build
        env:
          ORG_GRADLE_PROJECT_releaseVersionName: ${{ steps.version.outputs.releaseVersionName }}
          ORG_GRADLE_PROJECT_releaseVersionCode: ${{ steps.version.outputs.releaseVersionCode }}
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          ./gradlew testDebugUnitTest lintDebug lintRelease assembleRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  publish:
    environment: release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-release
          path: unsigned
      - name: Install signing tools
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "build-tools;37.0.0"
      - name: Sign and verify
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release-version.py "$RELEASE_TAG"
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          bash scripts/sign-release.sh unsigned/app-release-unsigned.apk "dist/couch-tasks-${RELEASE_TAG}.apk"
          cd dist
          sha256sum "couch-tasks-${RELEASE_TAG}.apk" > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/couch-tasks-${RELEASE_TAG}.apk" dist/SHA256SUMS \
            --verify-tag --title "$RELEASE_TAG" --generate-notes
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
