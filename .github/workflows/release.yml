name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release-version.py "$RELEASE_TAG" --format github >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install Android SDK packages
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Test and build
        env:
          ORG_GRADLE_PROJECT_releaseVersionName: ${{ steps.version.outputs.releaseVersionName }}
          ORG_GRADLE_PROJECT_releaseVersionCode: ${{ steps.version.outputs.releaseVersionCode }}
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          ./gradlew testDebugUnitTest lintDebug lintRelease assembleRelease
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  publish:
    environment: release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-release
          path: unsigned
      - name: Install signing tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'build-tools;37.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Sign and verify
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release-version.py "$RELEASE_TAG"
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          bash scripts/sign-release.sh unsigned/app-release-unsigned.apk "dist/couch-tasks-${RELEASE_TAG}.apk"
          cd dist
          sha256sum "couch-tasks-${RELEASE_TAG}.apk" > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/couch-tasks-${RELEASE_TAG}.apk" dist/SHA256SUMS \
            --verify-tag --title "$RELEASE_TAG" --generate-notes
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
